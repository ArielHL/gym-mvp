name: Deploy Frontend to Expo

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "app.json"
      - "babel.config.js"
      - "eas.json"
      - "global.css"
      - "metro.config.js"
      - "nativewind-env.d.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "Dockerfile.frontend"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build with EAS
    runs-on: ubuntu-latest
    environment: GimApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend tooling image
        run: docker build --file Dockerfile.frontend --tag gym-frontend-ci:${GITHUB_SHA} .

      - name: Queue Expo production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --env CI=1 \
            --env EXPO_TOKEN \
            --env EXPO_PUBLIC_SUPABASE_URL \
            --env EXPO_PUBLIC_SUPABASE_ANON_KEY \
            --env EXPO_PUBLIC_API_BASE_URL \
            gym-frontend-ci:${GITHUB_SHA} \
            bash -lc '
              : "${EXPO_TOKEN:?EXPO_TOKEN is required}"
              git config --global --add safe.directory /workspace
              npm ci
              eas build --platform all --profile production --non-interactive --no-wait
            '
